<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-ffmpeg {
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 12px;
      font-weight: 600;
    }

    .badge-ok {
      background-color: #065f46;
      color: #34d399;
    }

    .badge-err {
      background-color: #991b1b;
      color: #f87171;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .card-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .video-title {
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-main {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      background-color: #475569;
      color: #cbd5e1;
      transition: all 0.2s ease;
    }

    .btn-main.ready {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
    }

    .btn-main.ready:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4);
    }

    .btn-main:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .manual-box {
      margin-top: 12px;
      border-top: 1px dashed var(--border);
      padding-top: 12px;
    }

    .manual-input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      background: #090d16;
      border: 1px solid var(--border);
      color: #f8fafc;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .manual-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-secondary {
      width: 100%;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: #1e293b;
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background-color: #334155;
    }

    .progress-wrap {
      width: 100%;
      height: 6px;
      background: #090d16;
      border-radius: 3px;
      overflow: hidden;
      margin: 10px 0 6px 0;
      display: none;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .status-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
      word-break: break-word;
    }

    .btn-cancel {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #ef4444;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      background-color: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      margin-top: 8px;
      display: none;
    }

    .btn-cancel:hover {
      background-color: #ef4444;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">
      <img src="tai_lung-48.png" alt="TaiLung" width="18" height="18" style="vertical-align: middle; border-radius: 3px;">
      <span>TaiLung Downloader</span>
    </div>
    <div id="ffmpeg-badge" class="badge-ffmpeg badge-err">FFmpeg: ?</div>
  </div>

  <div class="card">
    <div class="card-label">Vídeo Detectado na Aba</div>
    <div id="video-title" class="video-title">Buscando player...</div>
  </div>

  <button id="btn-download" class="btn-main" disabled>Aguardando detecção...</button>

  <div id="progress-wrap" class="progress-wrap">
    <div id="progress-bar" class="progress-bar"></div>
  </div>

  <button id="btn-cancel" class="btn-cancel">⏹ Cancelar Download</button>
  <div id="status-desc" class="status-desc">Inicie a reprodução de um vídeo ou cole a URL abaixo.</div>

  <!-- ENTRADA MANUAL DE LINK -->
  <div class="manual-box">
    <div class="card-label">Ou Cole o Link / UUID do Vídeo</div>
    <input type="text" id="manual-url" class="manual-input" placeholder="https://player-vz-.../embed/?v=UUID">
    <button id="btn-manual" class="btn-secondary">⬇ Baixar por URL Manual</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
